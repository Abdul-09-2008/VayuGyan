<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — VayuGyan</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="profile-page">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand-group">
        <img src =  "images/logo.png" alt = "Logo" class = "logo-img">
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Products</a></li>
        <li><a href="contact.html" class="nav-link">Contact Us</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>

      <a href="profile.html" id="authNavBtn" class="nav-btn active">Account</a>
    </div>
  </nav>

  <!-- Main Profile Container -->
  <main class="profile-main-section">
    <div class="profile-container">

      <!-- Avatar Header Card -->
      <div class="profile-header-card">
        <div class="avatar-wrapper">
          <img id="profileAvatarImg" src="" alt="User Avatar" class="profile-avatar">
          <div id="defaultLetterAvatar" class="default-letter-avatar" style="display: none;">A</div>
        </div>
        <div class="avatar-actions">
          <div class="avatar-btn-row">
            <label for="avatarUploadInput" class="upload-btn">Upload New Photo</label>
            <button type="button" id="editCropBtn" class="edit-crop-btn" style="display: none;">Crop / Edit Photo</button>
          </div>
          <input type="file" id="avatarUploadInput" accept="image/*" style="display: none;">
          <button type="button" id="defaultAvatarBtn" class="text-btn" style="display: none;">Use Default Letter Avatar</button>
        </div>
      </div>

      <form id="profileForm" class="profile-form">
        
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Your Full Name" required>
          </div>
          <div class="form-group">
            <label for="emailAddress">Email Address</label>
            <input type="email" id="emailAddress" placeholder="your@email.com" disabled>
          </div>
        </div>

        <div class="form-group">
          <label for="shortBio">Short Bio / Organization</label>
          <textarea id="shortBio" rows="3" placeholder="Tell us about yourself or your company..."></textarea>
        </div>

        <hr class="profile-section-divider">

        <h3 class="section-sub-title">Security & Passwords</h3>
        
        <div class="form-group">
          <label for="currentPassword">Current Password</label>
          <div style="position: relative;">
            <input type="password" id="currentPassword" placeholder="••••••••">
            <a href="#" id="forgotPasswordLink" style="position: absolute; right: 14px; top: 12px; font-size: 0.82rem; font-weight: 600; color: #2563eb; text-decoration: none;">Forgot?</a>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••">
          </div>
        </div>

        <div id="profileStatusBanner" class="status-banner"></div>

        <div class="form-actions">
          <button type="button" id="signOutBtn" class="sign-out-btn">Sign Out</button>
          <button type="submit" id="saveProfileBtn" class="save-btn">Save Changes</button>
        </div>

      </form>

    </div>
  </main>

  <div id="cropModal" class="crop-modal-overlay" style="display: none;">
    <div class="crop-modal-content">
      <h3>Crop Profile Picture</h3>
      <p>Drag to position and use the zoom slider to adjust your image frame.</p>
      
      <div class="crop-canvas-container">
        <canvas id="cropCanvas"></canvas>
      </div>

      <div class="crop-controls">
        <label for="zoomRange" style="font-size: 0.85rem; font-weight: 600;">Zoom:</label>
        <input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1" style="width: 100%;">
      </div>

      <div class="crop-modal-actions">
        <button type="button" id="cancelCropBtn" class="btn-secondary">Cancel</button>
        <button type="button" id="confirmCropBtn" class="btn-primary">Crop & Save</button>
      </div>
    </div>
  </div>

  <div id="signOutModal" class="signout-modal-overlay" style="display: none;">
    <div class="signout-modal-content">
      <h3>Sign Out Confirmation</h3>
      <p>Are you sure you want to sign out of your VayuGyan session?</p>
      <div class="signout-modal-actions">
        <button type="button" id="cancelSignOutBtn" class="btn-secondary">Cancel</button>
        <button type="button" id="confirmSignOutBtn" class="btn-danger">Sign Out</button>
      </div>
    </div>
  </div>

  <script src="profile.js"></script>
</body>
</html>
